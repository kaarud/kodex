name: kodex
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - openpyxl>=3.1
  - pyyaml>=6.0
  - requests>=2.28
  - pytest>=7.0
  # R toolchain for rpkm_exon_curve.R (exon coverage / CNV curve)
  - r-base>=4.3
  - r-readxl
  - r-dplyr
  - r-tidyr
  - r-ggplot2
  - r-plotly
  - pandoc
  - r-data.table
  - r-testthat
  - htslib   # provides tabix for per-base.bed.gz region extraction
